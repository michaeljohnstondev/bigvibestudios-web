<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Vibe Studios | Contact</title>
    <meta name="description" content="Get in touch with Big Vibe Studios.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #000814 0%, #001d3d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 40px 0 10px;
            text-align: center;
        }

        .back-link {
            color: #00D4FF;
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #00ff88;
        }

        main {
            flex: 1;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 900;
        }

        .highlight {
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 40px;
            font-size: 1.05em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            display: block;
            color: #00D4FF;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95em;
        }

        input, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #00D4FF 0%, #00ff88 100%);
            color: #000814;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success, .error {
            display: none;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-size: 1.05em;
        }

        .success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .error {
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid #ff5050;
            color: #ff5050;
        }

        footer {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            width: 100%;
        }

        .footer-links {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #00D4FF;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            color: #00ff88;
        }

        .copyright {
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">← Back to Big Vibe Studios</a>
        </header>

        <main>
            <h1>Get in <span class="highlight">Touch</span></h1>
            <p class="subtitle">Say hi, ask anything, or pitch a project.</p>

            <form id="contactForm" action="https://formspree.io/f/xvznvlzz" method="POST">
                <div>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name">
                </div>

                <div>
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <!-- Honeypot — bots fill this, humans don't see it. Formspree drops anything with _gotcha set. -->
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

                <button type="submit" id="submitBtn">Send Message</button>
            </form>

            <div class="success" id="success">Thanks! Your message is on its way.</div>
            <div class="error" id="error">Something went wrong. Try again or email support@bigvibestudios.com directly.</div>
        </main>
    </div>

    <footer>
        <div class="footer-links">
            <a href="/privacy">Privacy Policy</a>
            <a href="/terms">Terms of Service</a>
            <a href="/contact">Contact</a>
        </div>
        <p class="copyright">&copy; 2025 Big Vibe Studios. All rights reserved.</p>
    </footer>

    <script>
        // Submit via fetch so the user stays on the page and gets inline
        // feedback instead of bouncing to Formspree's confirmation screen.
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const successBox = document.getElementById('success');
        const errorBox = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            successBox.style.display = 'none';
            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' },
                });

                if (response.ok) {
                    form.reset();
                    successBox.style.display = 'block';
                } else {
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
